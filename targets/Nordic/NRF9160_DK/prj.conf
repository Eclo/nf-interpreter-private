# nanoCLR needs a full libc (sscanf, strtod, float formatting, ...) and C++
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
# nanoCLR uses C++ standard library headers (type_traits, ...)
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_REBOOT=y

CONFIG_MAIN_STACK_SIZE=8192

# system heap: managed heap and CLR allocations come from here
# (the non-secure application only gets 128 KB of RAM, see nrf91xx_partition.dtsi)
CONFIG_HEAP_MEM_POOL_SIZE=81920

# flash storage (block storage / deployment)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# for debugging
CONFIG_DEBUG_THREAD_INFO=y

# serial: uart0 (interface MCU virtual COM port) is used by the Wire Protocol,
# so the Zephyr console (printk) goes to SEGGER RTT over the J-Link connection instead
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_ASYNC_API=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# need power management for uart
CONFIG_PM_DEVICE=y
CONFIG_POLL=y

# I2C
CONFIG_I2C=y

# Networking (LTE modem) configuration lives in overlay-net.conf and is only
# applied when the target is built with System.Net support.
