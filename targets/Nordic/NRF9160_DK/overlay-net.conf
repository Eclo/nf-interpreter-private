# Extra Kconfig fragment applied when building with networking (System.Net) support.
# NOTE: the nRF9160 cellular support in targets/Nordic/_netCellular hasn't been updated
# to the current nRF Connect SDK yet.

CONFIG_MODEM_KEY_MGMT=y

# Disable modem traces, since we need UART1 for the Wire Protocol
CONFIG_NRF_MODEM_LIB_TRACE=n

# Network support (offloaded to the modem)
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

# LTE support
CONFIG_LTE_LINK_CONTROL=y

# Modem info
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_SIM_ICCID=y

CONFIG_DATE_TIME=y
