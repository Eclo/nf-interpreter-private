# Requires download-install-ncs-zephyr-toolchain.yml to have run before.

parameters:
  - name: repoDirectory
    type: string
    default: $(Build.SourcesDirectory)

steps:
  - template: setup-cmake-user-presets.yml
    parameters:
      repoDirectory: ${{ parameters.repoDirectory }}

  - template: install-kconfig-tools.yml
    parameters:
      repoDirectory: ${{ parameters.repoDirectory }}

  - template: validate-kconfig.yml
    parameters:
      repoDirectory: ${{ parameters.repoDirectory }}
      targetPreset: $(TargetBoard)

  - task: CMake@1
    inputs:
      cmakeArgs: " --preset $(TargetBoard) -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_VERSION=$(NBGV_VersionMajor).$(NBGV_VersionMinor).$(NBGV_BuildNumber).$(TARGET_BUILD_COUNTER) -DTARGET_BOARD=$(TargetBoard) -DTARGET_NAME=$(TargetPublishName) -DNF_NORDIC_DEPS_DIR=$(NF_NORDIC_DEPS_DIR) $(BuildOptions)"
      workingDirectory: ${{ parameters.repoDirectory }}
    displayName: Setup build with CMake

  - task: CMake@1
    inputs:
      cmakeArgs: "--build --preset $(TargetBoard) --target all --config MinSizeRel"
      workingDirectory: ${{ parameters.repoDirectory }}
    displayName: Build with CMake
